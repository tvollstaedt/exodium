name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libglib2.0-dev

      - name: Stub DOSBox sidecar + resource dirs
        # tauri-build validates that the externalBin file and every bundle
        # resource path exist at compile time; tests never execute DOSBox,
        # so empty stubs beat downloading the real 30 MB build per CI run.
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          triple=$(rustc -vV | sed -n 's/^host: //p')
          suffix=""
          if [[ "$triple" == *windows* ]]; then suffix=".exe"; fi
          touch "src-tauri/binaries/dosbox-staging-${triple}${suffix}"
          mkdir -p src-tauri/resources/dosbox-bin src-tauri/resources/dosbox-shaders src-tauri/resources/dosbox-shader-presets
          touch src-tauri/resources/dosbox-bin/.placeholder
          touch src-tauri/resources/dosbox-shaders/.placeholder
          touch src-tauri/resources/dosbox-shader-presets/.placeholder

      - name: Install frontend dependencies
        run: pnpm install

      - name: Typecheck (tsc)
        run: pnpm typecheck

      - name: Frontend tests (vitest)
        run: pnpm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
