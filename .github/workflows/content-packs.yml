# Builds the emulator content-pack tarballs (manual dispatch only): the two
# Win9x emulators, or one ScummVM build per eXo pin.
#
# Produces workflow ARTIFACTS, never a release: publishing stays the manual
# `gh release create content-vN ... --latest=false` flow (CLAUDE.md §10 - a
# content release must never become "latest", and it must exist BEFORE the
# app release whose manifest.json references it). Run this only when the
# emulator pin changes; the pack tarballs must not be re-rolled afterwards
# (tar mtimes change the hash the manifest pins).
name: Emulator Content Packs

on:
  workflow_dispatch:
    inputs:
      packs:
        description: "Which set to build"
        type: choice
        options: [win9x, scummvm]
        default: win9x
        required: true
      scummvm_arches:
        description: 'Linux architectures to build (JSON array of uname -m values)'
        default: '["x86_64", "aarch64"]'
        type: string
      scummvm_versions:
        description: "ScummVM releases to package (JSON array; eXo's pins)"
        default: '["2.5.0", "2.8.0", "2.9.0", "2026.1.0"]'
        required: true
      dosbox_x_version:
        description: "DOSBox-X tag to build (keep near eXo's x98 build)"
        default: "2025.02.01"
        required: true
      e86box_version:
        description: "86Box release to package"
        default: "6.0"
        required: true
      pack_version:
        description: "Pack version suffix (-vN in the tarball names)"
        default: "1"
        required: true

jobs:
  # DOSBox-X has no upstream Linux binaries: build the pinned tag from source
  # and package it as an anylinux AppImage (sharun/uruntime).
  dosbox-x-linux:
    if: inputs.packs == 'win9x'
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare container (quick-sharun toolchain)
        uses: pkgforge-dev/anylinux-setup-action@v2
      - name: Build DOSBox-X AppImage from source
        env:
          DOSBOX_X_VERSION: ${{ inputs.dosbox_x_version }}
        run: sh scripts/build-dosbox-x-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dosbox-x-appimage
          path: |
            dist/DOSBox-X.AppImage
            dist/dosbox-x-*-source.tar.gz
          if-no-files-found: error

  linux-packs:
    if: inputs.packs == 'win9x'
    needs: dosbox-x-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dosbox-x-appimage
          path: dist
      - name: Assemble Linux pack tarballs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOSBOX_X_VERSION: ${{ inputs.dosbox_x_version }}
          E86BOX_VERSION: ${{ inputs.e86box_version }}
          PACK_VERSION: ${{ inputs.pack_version }}
        run: |
          bash scripts/build-emulator-packs.sh --platform linux --dosbox-x-appimage dist/DOSBox-X.AppImage
          # The GPL source tarball travels inside the same artifact. It must be
          # COPIED into dist/packs first: a second path pattern would re-root
          # the artifact at dist/ and nest the packs under packs/packs/, which
          # is exactly where the verification gate does not look (first run
          # failed on this).
          cp dist/dosbox-x-*-source.tar.gz dist/packs/
      - uses: actions/upload-artifact@v4
        with:
          name: packs-linux
          path: dist/packs/*.tar.gz
          if-no-files-found: error

  macos-packs:
    if: inputs.packs == 'win9x'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Assemble macOS pack tarballs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOSBOX_X_VERSION: ${{ inputs.dosbox_x_version }}
          E86BOX_VERSION: ${{ inputs.e86box_version }}
          PACK_VERSION: ${{ inputs.pack_version }}
        run: bash scripts/build-emulator-packs.sh --platform macos
      - uses: actions/upload-artifact@v4
        with:
          name: packs-macos
          path: dist/packs/*.tar.gz
          if-no-files-found: error

  # Extract every tarball and assert the properties whose absence has shipped
  # as a bug before: the stable binary path (resolvers probe exact names),
  # exec bits (tar preserves, the installer never chmods), zero AppleDouble
  # sidecars (invisible to `tar tzf`, break .app signatures), and surviving
  # .app symlinks (a materialized Frameworks symlink breaks the seal).
  assemble:
    if: inputs.packs == 'win9x'
    needs: [linux-packs, macos-packs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packs-*
          merge-multiple: true
          path: packs
      - name: Verification gate
        run: |
          set -euo pipefail
          cd packs
          check() { # check <tarball> <binary-path> [expect-symlinks]
            local tb="$1" bin="$2" want_links="${3:-no}"
            local dir; dir="$(mktemp -d)"
            tar xzf "$tb" -C "$dir"
            if [ ! -f "$dir/$bin" ]; then
              echo "::error::$tb: expected binary $bin missing"; exit 1
            fi
            if [ ! -x "$dir/$bin" ]; then
              echo "::error::$tb: $bin is not executable"; exit 1
            fi
            if find "$dir" -name '._*' | grep -q .; then
              echo "::error::$tb: AppleDouble ._* entries present"; exit 1
            fi
            if [ "$want_links" = "yes" ] && ! find "$dir" -type l | grep -q .; then
              echo "::error::$tb: .app bundle lost its symlinks"; exit 1
            fi
            rm -rf "$dir"
            echo "OK: $tb"
          }
          V="${{ inputs.pack_version }}"
          check "dosbox-x-linux-x86_64-v$V.tar.gz" "dosbox-x/DOSBox-X.AppImage"
          check "86box-linux-x86_64-v$V.tar.gz"    "86box/86Box.AppImage"
          # dosbox-x.app is fully static - the upstream release zip carries 0
          # symlinks (verified against dosbox-x-macosx-arm64-20250201150724.zip),
          # so only 86Box.app (Qt framework links) gets the symlink assertion.
          check "dosbox-x-macos-arm64-v$V.tar.gz"  "dosbox-x/dosbox-x.app/Contents/MacOS/dosbox-x"
          check "86box-macos-universal-v$V.tar.gz" "86box/86Box.app/Contents/MacOS/86Box" yes
      - name: Emit manifest snippet + checksums
        run: |
          set -euo pipefail
          cd packs
          sha256sum *.tar.gz > SHA256SUMS
          BASE="https://github.com/${{ github.repository }}/releases/download/content-vN"
          V="${{ inputs.pack_version }}"
          jq -n \
            --arg base "$BASE" \
            --arg dlx "dosbox-x-linux-x86_64-v$V.tar.gz" \
            --arg dmx "dosbox-x-macos-arm64-v$V.tar.gz" \
            --arg blx "86box-linux-x86_64-v$V.tar.gz" \
            --arg bmx "86box-macos-universal-v$V.tar.gz" \
            --arg h_dlx "$(sha256sum $(ls dosbox-x-linux-*) | cut -d' ' -f1)" \
            --arg h_dmx "$(sha256sum $(ls dosbox-x-macos-*) | cut -d' ' -f1)" \
            --arg h_blx "$(sha256sum $(ls 86box-linux-*) | cut -d' ' -f1)" \
            --arg h_bmx "$(sha256sum $(ls 86box-macos-*) | cut -d' ' -f1)" \
            --argjson s_dlx "$(wc -c < $(ls dosbox-x-linux-*) | tr -d ' ')" \
            --argjson s_dmx "$(wc -c < $(ls dosbox-x-macos-*) | tr -d ' ')" \
            --argjson s_blx "$(wc -c < $(ls 86box-linux-*) | tr -d ' ')" \
            --argjson s_bmx "$(wc -c < $(ls 86box-macos-*) | tr -d ' ')" \
            '{
              "dosbox-x": { platforms: {
                "darwin-aarch64": { url: ($base + "/" + $dmx), sha256: $h_dmx, size_bytes: $s_dmx },
                "linux-x86_64":  { url: ($base + "/" + $dlx), sha256: $h_dlx, size_bytes: $s_dlx } } },
              "86box": { platforms: {
                "darwin-aarch64": { url: ($base + "/" + $bmx), sha256: $h_bmx, size_bytes: $s_bmx },
                "linux-x86_64":  { url: ($base + "/" + $blx), sha256: $h_blx, size_bytes: $s_blx } } }
            }' > manifest-snippet.json
          cat manifest-snippet.json
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-packs
          path: packs/
          if-no-files-found: error

  # ── ScummVM: one pack per eXo pin ──────────────────────────────────────────
  # Upstream ships a universal macOS DMG but no Linux binary of any release,
  # so Linux compiles from the release tarball, exactly like DOSBox-X.
  scummvm-linux:
    if: inputs.packs == 'scummvm'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.scummvm_versions) }}
        arch: ${{ fromJSON(inputs.scummvm_arches) }}
    # The container image is multi-arch; the runner picks the architecture.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare container (quick-sharun toolchain)
        uses: pkgforge-dev/anylinux-setup-action@v2
      - name: Build ScummVM ${{ matrix.version }} AppImage from source
        env:
          SCUMMVM_VERSION: ${{ matrix.version }}
        run: sh scripts/build-scummvm-appimage.sh
      - name: Assemble the Linux pack tarball
        env:
          SCUMMVM_VERSION: ${{ matrix.version }}
          PACK_VERSION: ${{ inputs.pack_version }}
        run: |
          bash scripts/build-emulator-packs.sh --platform linux --emulator scummvm \
            --scummvm-version "${{ matrix.version }}" --scummvm-appimage dist/ScummVM.AppImage
          cp dist/scummvm-*-source.tar.xz dist/packs/
      - uses: actions/upload-artifact@v4
        with:
          name: scummvm-linux-${{ matrix.arch }}-${{ matrix.version }}
          path: dist/packs/*
          if-no-files-found: error

  scummvm-macos:
    if: inputs.packs == 'scummvm'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.scummvm_versions) }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the macOS pack tarball
        env:
          SCUMMVM_VERSION: ${{ matrix.version }}
          PACK_VERSION: ${{ inputs.pack_version }}
        run: |
          bash scripts/build-emulator-packs.sh --platform macos --emulator scummvm \
            --scummvm-version "${{ matrix.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: scummvm-macos-${{ matrix.version }}
          path: dist/packs/*.tar.gz
          if-no-files-found: error

  scummvm-assemble:
    if: inputs.packs == 'scummvm'
    needs: [scummvm-linux, scummvm-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: scummvm-*
          merge-multiple: true
          path: packs
      - name: Verification gate
        run: |
          set -euo pipefail
          cd packs
          check() { # check <tarball> <binary-path> [expect-symlinks]
            local tb="$1" bin="$2" want_links="${3:-no}"
            local dir; dir="$(mktemp -d)"
            tar xzf "$tb" -C "$dir"
            [ -f "$dir/$bin" ] || { echo "::error::$tb: expected binary $bin missing"; exit 1; }
            [ -x "$dir/$bin" ] || { echo "::error::$tb: $bin is not executable"; exit 1; }
            if find "$dir" -name '._*' | grep -q .; then
              echo "::error::$tb: AppleDouble ._* entries present"; exit 1
            fi
            if [ "$want_links" = "yes" ] && ! find "$dir" -type l | grep -q .; then
              echo "::error::$tb: .app bundle lost its symlinks"; exit 1
            fi
            rm -rf "$dir"
            echo "OK: $tb"
          }
          V="${{ inputs.pack_version }}"
          for ver in $(echo '${{ inputs.scummvm_versions }}' | jq -r '.[]'); do
            # ScummVM.app carries Sparkle.framework, so its symlinks must survive.
            check "scummvm-$ver-macos-universal-v$V.tar.gz" \
                  "scummvm-$ver/ScummVM.app/Contents/MacOS/scummvm" yes
            for arch in $(echo '${{ inputs.scummvm_arches }}' | jq -r '.[]'); do
              check "scummvm-$ver-linux-$arch-v$V.tar.gz" \
                    "scummvm-$ver/ScummVM.AppImage"
            done
          done
      - name: Emit manifest snippet + checksums
        run: |
          set -euo pipefail
          cd packs
          sha256sum *.tar.gz > SHA256SUMS
          BASE="https://github.com/${{ github.repository }}/releases/download/content-vN"
          V="${{ inputs.pack_version }}"
          # The macOS tarball is universal (x86_64 + arm64), so both Mac
          # platform tokens point at the same file.
          src() { # src <file> -> {url,sha256,size_bytes}
            jq -n --arg url "$BASE/$1" --arg h "$(sha256sum "$1" | cut -d' ' -f1)" \
              --argjson s "$(wc -c < "$1" | tr -d ' ')" '{url: $url, sha256: $h, size_bytes: $s}'
          }
          for ver in $(echo '${{ inputs.scummvm_versions }}' | jq -r '.[]'); do
            mac="$(src "scummvm-$ver-macos-universal-v$V.tar.gz")"
            plat="$(jq -n --argjson m "$mac" '{"darwin-aarch64": $m, "darwin-x86_64": $m}')"
            for arch in $(echo '${{ inputs.scummvm_arches }}' | jq -r '.[]'); do
              lin="$(src "scummvm-$ver-linux-$arch-v$V.tar.gz")"
              plat="$(jq -n --argjson p "$plat" --argjson l "$lin" --arg k "linux-$arch" '$p + {($k): $l}')"
            done
            jq -n --arg id "scummvm-$ver" --argjson p "$plat" '{ ($id): { platforms: $p } }'
          done | jq -s 'add' > manifest-snippet.json
          cat manifest-snippet.json
      - uses: actions/upload-artifact@v4
        with:
          name: scummvm-packs
          path: packs/
          if-no-files-found: error
