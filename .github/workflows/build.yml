name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            artifact-pattern: "*.dmg"
          - os: ubuntu-22.04
            platform: linux
            artifact-pattern: "*.deb,*.AppImage"
          - os: windows-latest
            platform: windows
            artifact-pattern: "*.exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # The gstreamer runtime packages feed bundleMediaFramework: linuxdeploy
          # copies the runner's plugins into the AppImage next to the GStreamer
          # core it already bundles as a WebKit dependency. Plugins only load
          # into the core they were built against, so the ones from this runner
          # are the ONLY ones that bundled core can ever use - a host's plugins
          # (Arch: 1.28 vs the bundled 1.20) refuse both ways. deb/rpm instead
          # declare distro packages as dependencies and bundle nothing.
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libglib2.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav \
            gstreamer1.0-alsa \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-gl

      - name: Download DOSBox Staging
        shell: bash
        run: bash scripts/get-dosbox.sh

      - name: Verify DOSBox staging is complete
        # Guard against shipping placeholder shaders: without the mandatory
        # fallback shader, DOSBox Staging aborts on every fresh install
        # (shader defaults to crt-auto), and without the presets crt-auto
        # degrades to a plain shader. Fail the release build instead.
        shell: bash
        run: |
          if [[ ! -f src-tauri/resources/dosbox-shaders/interpolation/bilinear.glsl ]]; then
            echo "::error::shader staging is missing or placeholder-only - a release from this state crashes DOSBox on fresh installs"
            exit 1
          fi
          if [[ ! -f src-tauri/resources/dosbox-shader-presets/crt/crt-hyllian/hercules.preset ]]; then
            echo "::error::shader-presets staging is missing or placeholder-only - crt-auto would degrade to a plain shader"
            exit 1
          fi

      # The Win9x emulators (DOSBox-X, 86Box) are NOT bundled anymore: they
      # ship as content packs (content-packs.yml builds them), saving 344 MB
      # of macOS bundle / ~90 MB of Linux installer for binaries most users
      # never ran. get-emulators.sh remains a dev-only helper.

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          # Signing secrets are only set for main/tag builds; PRs from forks won't have them.
          # Tauri skips updater signing if the key is empty, so this is safe.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

      # Two edits to the AppDir, both about the GPU:
      #
      # 1. Tauri's linuxdeploy auto-bundles GPU-adjacent libs (libwayland,
      #    libgbm, libdrm, libEGL, libGL) from the jammy runner. These must
      #    ALWAYS come from the host: the bundled copies break EGL display
      #    creation against newer Mesa (Arch/Cosmic, Intel iris: "Could not
      #    create default EGL display: EGL_BAD_PARAMETER. Aborting...").
      # 2. linuxdeploy's GTK hook forces GDK_BACKEND=x11 over
      #    tauri-apps/tauri#8541, and X11 is the backend on which NVIDIA
      #    cannot allocate a GBM buffer at all - so every AppImage user was
      #    pinned to WebKit's software rasterizer no matter what
      #    choose_render_path decided. Drop the export and let GTK pick;
      #    apply_render_path() puts GDK_BACKEND=x11 back by itself if the
      #    previous start did not survive.
      #
      # Then repack and re-sign (the updater signature covers the file bytes).
      - name: Fix AppImage graphics stack (host GPU libs, GDK backend)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          wget -q -O /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          cd src-tauri/target/release/bundle/appimage
          name=$(ls *.AppImage)
          "./$name" --appimage-extract >/dev/null
          rm -fv squashfs-root/usr/lib/libwayland* squashfs-root/usr/lib/libgbm* \
                 squashfs-root/usr/lib/libdrm* squashfs-root/usr/lib/libEGL* \
                 squashfs-root/usr/lib/libGL*
          hook=squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
          if ! grep -q '^export GDK_BACKEND=x11' "$hook"; then
            echo "::error::$hook no longer exports GDK_BACKEND=x11 - re-check whether the patch below is still needed"
            exit 1
          fi
          sed -i 's|^export GDK_BACKEND=x11.*$|# GDK_BACKEND deliberately unset - Exodium picks the backend, see apply_render_path()|' "$hook"
          grep -n 'GDK_BACKEND' "$hook"
          rm -f "$name" "$name.sig"
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run squashfs-root "$name"
          rm -rf squashfs-root
          ls -la "$name"
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            cd "$GITHUB_WORKSPACE"
            pnpm tauri signer sign "src-tauri/target/release/bundle/appimage/$name"
          fi

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: exodium-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 14

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: exodium-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 14

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: exodium-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 14

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checkout (for latest.json generator)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Generate updater latest.json
        run: |
          python3 repo/scripts/gen_latest_json.py artifacts "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" > artifacts/latest.json
          cat artifacts/latest.json

      # Stable-name copies of the three primary installers so
      # releases/latest/download/<name> permalinks (README buttons) never
      # break. No .sig uploaded for these, so gen_latest_json ignores them.
      - name: Create stable-name download aliases
        run: |
          mkdir -p stable
          cp "$(find artifacts -name '*-setup.exe' | head -1)" stable/Exodium-windows-x64-setup.exe
          cp "$(find artifacts -name '*.dmg' | head -1)" stable/Exodium-macos-aarch64.dmg
          cp "$(find artifacts -name '*.AppImage' | head -1)" stable/Exodium-linux-x86_64.AppImage
          ls -la stable

      - name: Generate release body (download table)
        run: |
          python3 repo/scripts/gen_release_body.py artifacts "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" > release_body.md
          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # The download-table body is prepended; generate_release_notes
          # appends GitHub's auto changelog after it.
          body_path: release_body.md
          generate_release_notes: true
          # Recursive globs because upload-artifact@v4 preserves the common-prefix
          # directory hierarchy - Linux has bundle/deb + bundle/appimage, so
          # files end up nested. (MSI is no longer built: MSI<->NSIS updater
          # cross-grades are unsupported, NSIS is the only Windows format.)
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
            artifacts/**/*.exe
            artifacts/**/*.app.tar.gz
            artifacts/**/*.sig
            artifacts/latest.json
            stable/*
